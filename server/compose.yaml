# CG-connector: serwer + tunel Tailscale Funnel (ADR-0002) albo, awaryjnie, ngrok.
# Uruchamianie: w katalogu server/  ->  docker compose up -d --build
# Sekrety tylko w server/.env (wzór: .env.example). Nigdy w tym pliku.
name: cg-connector

services:
  cg-server:
    build: .
    image: cg-server:local
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Utwardzenie: system plików kontenera tylko do odczytu (zapis wyłącznie w /data
    # i w /tmp w pamięci), bez żadnych uprawnień jądra (proces i tak nie jest rootem).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    env_file: .env
    environment:
      # Klucz Tailscale jest tylko dla kontenera tailscale; nadpisujemy go pustym,
      # żeby nie trafił do środowiska serwera (env_file wczytuje cały .env).
      TS_AUTHKEY: ""
      NGROK_AUTHTOKEN: ""
    volumes:
      - ${CG_HOST_DATA_DIR:-./data}:/data
    # Port tylko na 127.0.0.1 (lokalny podgląd /health, status.ps1).
    # Z internetu serwer jest osiągalny wyłącznie przez Funnel (kontener tailscale).
    ports:
      - "127.0.0.1:8000:8000"

  tailscale:
    # Przypięty digestem; aktualizuje go Dependabot (ekosystem docker-compose).
    # Bez read_only/cap_drop: tailscaled (tryb userspace, bez NET_ADMIN) nie był z nimi
    # testowany, a awaria oznacza brak tunelu; patrz docs/bezpieczenstwo.md.
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    # Nazwa kontenera w Dockerze celowo INNA niż "cg-server": inaczej nazwa
    # cg-server wskazywałaby w tym kontenerze na niego samego (/etc/hosts),
    # a Funnel nie trafiłby do serwera. Nazwa maszyny w Tailscale to TS_HOSTNAME.
    hostname: cg-tailscale
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TS_HOSTNAME: cg-server            # adres: https://cg-server.<tailnet>.ts.net
      TS_AUTHKEY: ${TS_AUTHKEY:-}       # z .env; potrzebny tylko przy pierwszym logowaniu
      TS_AUTH_ONCE: "true"              # nie loguj ponownie, jeśli stan już istnieje
      TS_STATE_DIR: /var/lib/tailscale  # trwały stan = ta sama maszyna i adres po restarcie
      # serve.json: Funnel wystawia TYLKO wybrane ścieżki (/health, /api/v1/, /mcp,
      # OAuth z ADR-0003); reszta dostaje 404 od Tailscale i nie dociera do serwera.
      # Serve obcina prefiks punktu montowania, dlatego każdy Proxy ma pełną ścieżkę.
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"              # bez /dev/net/tun i bez uprawnień NET_ADMIN
    volumes:
      # Osobny folder, poza /data serwera: serwer nie ma dostępu do klucza węzła Tailscale.
      - ${CG_HOST_TS_DIR:-./tailscale-state}:/var/lib/tailscale
      # Montujemy katalog (nie plik), żeby zmiany serve.json były widoczne bez restartu.
      - ../ops/tailscale:/config:ro
    depends_on:
      - cg-server

  # Plan B tunelu (ADR-0002, docs/instalacja-serwera.md "Plan B: ngrok").
  # Startuje TYLKO z profilem ngrok: w .env ustaw COMPOSE_PROFILES=ngrok.
  # Darmowy plan ngrok: jedna stała domena *.ngrok-free.app, 20 000 żądań/mies.
  ngrok:
    profiles: ["ngrok"]
    # Przypięty digestem; aktualizuje go Dependabot (ekosystem docker-compose).
    image: ngrok/ngrok:3.39.13-debian@sha256:ff3b5c3674432d14a786349908b7bdf28ee56c25662637afcbe7180d471993ef
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}   # z .env, nigdy w tym pliku
      HOME: /tmp                              # system plików tylko do odczytu
    # Ten sam adres co CG_PUBLIC_HOST. Polityka ruchu przepuszcza tylko te ścieżki,
    # które Funnel wystawia w ops/tailscale/serve.json; reszta dostaje 404.
    command:
      - http
      - cg-server:8000
      - --url=https://${CG_PUBLIC_HOST:-brak-CG_PUBLIC_HOST}
      - --traffic-policy-file=/config/policy.yml
      - --log=stdout
    volumes:
      - ../ops/ngrok:/config:ro
    depends_on:
      - cg-server
