# Wydanie aplikacji: tag vX.Y.Z → podpisany APK + suma SHA-256 w GitHub Release.
# Instrukcja dla Tomka (klucz, Environment "release", sekrety, tag): docs/release.md.
#
# Joby: build (bez sekretów) → sign (tylko tag; Environment "release" z sekretami
# i zatwierdzeniem przez Tomka) → release (tylko tag; jedyny z contents: write).
# Na PR zmieniającym ten plik: build + dry-run (podpis jednorazowym kluczem z CI),
# bez sekretów i bez publikacji.
name: release-android
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release-android.yml", ".github/scripts/sign-apk.sh"]
permissions:
  contents: read
concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false
env:
  NAME: ${{ github.event_name == 'push' && github.ref_name || 'proba' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Tag zgodny z versionName
        if: github.event_name == 'push'
        run: |
          vn=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts)
          if [ "v$vn" != "$NAME" ]; then
            echo "::error::Tag $NAME nie pasuje do versionName \"$vn\" w android/app/build.gradle.kts. Podbij versionName i versionCode w PR, scal, dopiero potem utwórz tag (docs/release.md)."
            exit 1
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build release APK (bez podpisu, R8)
        working-directory: android
        run: |
          ./gradlew assembleRelease --stacktrace
          n=$(find app/build/outputs/apk/release -name '*.apk' | wc -l)
          [ "$n" = 1 ] || { echo "::error::Oczekiwano jednego APK, jest $n"; exit 1; }
          mv app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/unsigned.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-unsigned
          path: ${{ runner.temp }}/unsigned.apk
          retention-days: 1

  dry-run:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apk-unsigned
          path: ${{ runner.temp }}/in
      - name: Podpis jednorazowym kluczem (bez sekretów)
        run: |
          ks="$RUNNER_TEMP/proba.keystore"
          ANDROID_KEYSTORE_PASSWORD=$(openssl rand -hex 16)
          export ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD=$ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS=proba
          keytool -genkeypair -keystore "$ks" -storetype PKCS12 -alias proba -keyalg RSA \
            -keysize 2048 -validity 1 -dname "CN=CG-connector proba" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD
          .github/scripts/sign-apk.sh "$ks" "$RUNNER_TEMP/in/unsigned.apk" "$RUNNER_TEMP/dist/cg-connector-$NAME.apk"
          grep -q 'certificate SHA-256 digest' "$RUNNER_TEMP/dist/cg-connector-$NAME.apk.certs.txt"

  sign:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Sekrety podpisu są tylko w tym Environment (dozwolone tagi v*, zatwierdza Tomek).
    environment: release
    steps:
      - name: Sekrety podpisu są ustawione
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KS_PASS" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASS" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Brak sekretów podpisu APK::Brakuje:$missing w Environment 'release'. Dodaj je w Settings → Environments → release (docs/release.md) i uruchom ten workflow ponownie (Re-run jobs). Release NIE został utworzony."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apk-unsigned
          path: ${{ runner.temp }}/in
      - name: Podpis APK (apksigner)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ks" \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 nie jest poprawnym base64 (docs/release.md)."; exit 1; }
          .github/scripts/sign-apk.sh "$ks" "$RUNNER_TEMP/in/unsigned.apk" "$RUNNER_TEMP/dist/cg-connector-$NAME.apk"
          rm -f "$ks"
      - name: Usuń klucz z dysku runnera
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-signed
          path: |
            ${{ runner.temp }}/dist/cg-connector-${{ env.NAME }}.apk
            ${{ runner.temp }}/dist/cg-connector-${{ env.NAME }}.apk.sha256
            ${{ runner.temp }}/dist/cg-connector-${{ env.NAME }}.apk.certs.txt
          retention-days: 1

  release:
    if: github.event_name == 'push'
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # tylko do utworzenia Release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apk-signed
          path: dist
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          apk="dist/cg-connector-$NAME.apk"
          sha=$(cut -d' ' -f1 "$apk.sha256")
          cert=$(sed -n 's/.*certificate SHA-256 digest: //p' "$apk.certs.txt" | head -n1)
          cat > notes.md <<EOF
          Aplikacja Android CG-connector $NAME.

          **Instalacja:** pobierz \`$(basename "$apk")\` na telefon i otwórz (zgoda na instalację z tego źródła). Aktualizacja instaluje się na poprzednią wersję bez utraty danych.

          - SHA-256 pliku APK: \`$sha\`
          - SHA-256 certyfikatu podpisu: \`$cert\` (taki sam w każdym wydaniu)

          EOF
          pre=""
          case "$NAME" in *-*) pre="--prerelease" ;; esac
          # Stała nazwa: link .../releases/latest/download/cg-connector.apk zawsze pobiera najnowszą wersję.
          cp "$apk" dist/cg-connector.apk
          gh release create "$NAME" "$apk" "$apk.sha256" dist/cg-connector.apk --verify-tag $pre \
            --title "CG-connector $NAME" --notes-file notes.md --generate-notes
