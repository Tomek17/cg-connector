name: ci-ops
on:
  pull_request:
    paths: ["ops/**", ".github/workflows/ci-ops.yml"]
  push:
    branches: [main]
    paths: ["ops/**", ".github/workflows/ci-ops.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Ta sama wersja co obraz cg-server (w nim działa część kopii).
          python-version: "3.12"
      - name: shellcheck (skrypty WSL i VPS)
        run: shellcheck -x ops/wsl/*.sh ops/vps/*.sh
      - name: Testy kopii zapasowych (syntetyczna baza SQLite)
        run: python -m unittest discover -s ops/tests -v
