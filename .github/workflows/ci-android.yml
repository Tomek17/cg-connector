name: ci-android
on:
  pull_request:
    paths: ["android/**", ".github/workflows/ci-android.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/ci-android.yml"]
permissions:
  contents: read
concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Runner ma preinstalowany Android SDK (ANDROID_HOME) z zaakceptowanymi licencjami;
      # brakującą platformę i build-tools AGP dociąga sam, z właściwą nazwą pakietu.
      # setup-gradle domyślnie weryfikuje sumę gradle-wrapper.jar i cache'uje zależności.
      - uses: gradle/actions/setup-gradle@v4
      - name: Build (debug + release bez podpisu, R8), testy jednostkowe, lint
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lintDebug --stacktrace
      - name: Schemat Room zacommitowany
        # Schemat generuje build (KSP). Różnica = trzeba zacommitować app/schemas/ (diff poniżej).
        run: |
          git add --intent-to-add app/schemas
          git diff --exit-code -- app/schemas
      - name: Podsumowanie lintu i testów w logu
        if: failure()
        run: |
          cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
          grep -l -E '<(failure|error)' app/build/test-results/testDebugUnitTest/*.xml | xargs -r cat || true
      - name: Raporty testów i lintu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7
