name: ci-android
on:
  pull_request:
    paths: ["android/**", ".github/workflows/ci-android.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/ci-android.yml"]
permissions:
  contents: read
concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # Domyślny pakiet "tools" nie istnieje już w repozytorium SDK.
          packages: "platform-tools platforms;android-37 build-tools;36.0.0"
      # setup-gradle domyślnie weryfikuje sumę gradle-wrapper.jar i cache'uje zależności.
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, testy jednostkowe, lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace
      - name: Raporty testów i lintu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7
