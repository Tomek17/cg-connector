name: ci-android
on:
  pull_request:
    paths: ["android/**", ".github/workflows/ci-android.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/ci-android.yml"]
permissions:
  contents: read
concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Runner ma preinstalowany Android SDK (ANDROID_HOME) z zaakceptowanymi licencjami;
      # brakującą platformę i build-tools AGP dociąga sam, z właściwą nazwą pakietu.
      # setup-gradle domyślnie weryfikuje sumę gradle-wrapper.jar i cache'uje zależności.
      - uses: gradle/actions/setup-gradle@v4
      - name: Build (debug + release bez podpisu, R8), testy jednostkowe, lint
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lintDebug --stacktrace
      # Jak działa kontrola schematu: plugin Room podaje KSP app/schemas/ jako wejście.
      # Room zapisuje <wersja>.json do katalogu pośredniego TYLKO wtedy, gdy schemat z kodu
      # różni się od zacommitowanego (albo pliku brak), a copyRoomSchemas kopiuje go do
      # app/schemas/. Dlatego "copyRoomSchemas NO-SOURCE" w logu = schemat zgodny.
      - name: Schemat Room zacommitowany
        run: |
          git add --intent-to-add app/schemas
          if ! git diff --exit-code -- app/schemas; then
            echo "::error::Schemat Room w app/schemas/ nie zgadza się z kodem. Zbuduj lokalnie (./gradlew assembleDebug) i zacommituj app/schemas/ (diff powyżej). Zmiana encji wymaga podbicia wersji bazy i migracji."
            exit 1
          fi
      - name: Kontrola kontroli — rozjechany schemat jest wykrywany
        # Psujemy kopię schematu bieżącej wersji (najwyższy numer) i sprawdzamy, że KSP
        # odtwarza go w app/schemas/. Chroni przed cichym wyłączeniem kontroli powyżej
        # (np. zmiana konfiguracji pluginu Room albo exportSchema = false).
        run: |
          f=$(ls app/schemas/*/*.json | sort -V | tail -n1)
          # Plik wraca do wersji z repo przy każdym wyjściu (także błędzie Gradle).
          trap 'git checkout -- "$f"' EXIT
          python3 - "$f" <<'PY'
          import json, sys
          p = sys.argv[1]
          d = json.load(open(p))
          col = d["database"]["entities"][0]["fields"][0]
          col["affinity"] = "BLOB" if col["affinity"] != "BLOB" else "TEXT"
          json.dump(d, open(p, "w"), indent=2)
          PY
          git diff --quiet -- "$f" && { echo "::error::Nie udało się zepsuć $f"; exit 1; }
          ./gradlew :app:kspDebugKotlin --rerun :app:copyRoomSchemas --quiet
          if ! git diff --exit-code -- "$f"; then
            echo "::error::Room nie odtworzył $f — kontrola schematu nie działa. Sprawdź room { schemaDirectory(...) } i exportSchema w @Database."
            exit 1
          fi
          echo "OK: rozjechany $f został wykryty i odtworzony."
      - name: Podsumowanie lintu i testów w logu
        if: failure()
        run: |
          cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
          grep -l -E '<(failure|error)' app/build/test-results/testDebugUnitTest/*.xml | xargs -r cat || true
      - name: Raporty testów i lintu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7
